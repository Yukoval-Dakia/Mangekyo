name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - &checkout
        name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - &pnpm
        name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - &node
        name: Set up Node.js and cache pnpm store
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.10.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - &install
        name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - &build-kernel
        name: Build the kernel package for test imports
        run: pnpm build:kernel
      - name: Load the Python test image
        env:
          PYTHON_TEST_IMAGE: python@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
        run: |
          docker pull "$PYTHON_TEST_IMAGE"
          docker tag "$PYTHON_TEST_IMAGE" python:3.12-alpine
      - name: Run unit tests
        run: pnpm exec vitest run

  repository:
    name: Structure and test budget
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - name: Check structure
        run: pnpm check:structure
      - name: Check test budget
        run: pnpm check:test-budget

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - name: Build kernel declarations and typecheck
        run: pnpm typecheck

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.7-alpine3.24@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_DB: mangekyo_ci
          POSTGRES_USER: mangekyo_ci
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U mangekyo_ci -d mangekyo_ci"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - *build-kernel
      - name: Run PostgreSQL tests
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          export MANGEKYO_TEST_DATABASE_URL="postgresql://mangekyo_ci:ci-only@127.0.0.1:${POSTGRES_PORT:?PostgreSQL service port is missing}/mangekyo_ci"
          pnpm exec vitest run --config vitest.pg.config.ts

  package-boundary:
    name: Packed kernel package boundary
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - name: Check the packed package in an isolated consumer
        run: pnpm test:boundary
