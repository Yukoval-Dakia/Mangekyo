# Mangekyō 私有单机部署 Compose 模板
#
# 仅绑定 loopback，守住隐私边界（docs/product-spec.md D06/D07）。
# 使用前先复制 deploy/.env.example 为 deploy/.env 并填写真实值。
# 启动：cd deploy && docker compose --env-file .env up -d --build
# 说明：docs/deploy/self-hosted.md

name: mangekyo

services:
  postgres:
    image: postgres:18.7-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mangekyo}
      POSTGRES_USER: ${POSTGRES_USER:-mangekyo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      # 仅 loopback；如需远程访问请自行改绑并加固（SSH 隧道优先）。
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  temporal:
    # Temporal 官方单容器开发/自托管镜像；生产请按 https://docs.temporal.io/production-deployment 评估。
    image: temporalio/auto-setup:1.32.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-mangekyo}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_SEEDS: postgres
      # 动态配置文件：只读挂载 temporal-dynamicconfig.yaml，启用 Worker Deployments API。
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/development.yaml
      ENABLE_ES: "false"
      SKIP_SCHEMA_SETUP: "false"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    volumes:
      - temporaldata:/var/lib/temporal
      - ./temporal-dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/development.yaml:ro
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7423}:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address 127.0.0.1:7233 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  temporal-ui:
    # Temporal 官方 UI 镜像；仅绑定 loopback，守住 D06 隐私边界。
    image: temporalio/ui:2.42.1
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://127.0.0.1:${TEMPORAL_UI_PORT:-8423}"
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8423}:8080"
    security_opt:
      - no-new-privileges:true

  studio:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.studio
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Studio 走标准 PG 独立变量连库：密码含 @ / ? # : % & 等特殊字符时无需做 URI 编码，
      # 避免拼进 postgresql:// URI 导致解析失败或凭据损坏（MANGEKYO_DATABASE_URL 仍最高优先）。
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-mangekyo}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-mangekyo}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      MANGEKYO_PORT: "4317"
      # 容器内须监听 0.0.0.0 才能接收端口映射流量；宿主机侧仍只映射 127.0.0.1（D06）。
      MANGEKYO_HOST: "0.0.0.0"
      # 端口映射后浏览器 Host 头带宿主机端口（如 127.0.0.1:4318），需显式放行；
      # 末尾拼接用户自定义值，改 STUDIO_PORT 时本机地址自动跟随。
      MANGEKYO_ALLOWED_HOSTS: "127.0.0.1:${STUDIO_PORT:-4317},localhost:${STUDIO_PORT:-4317},[::1]:${STUDIO_PORT:-4317},${MANGEKYO_ALLOWED_HOSTS:-}"
      MANGEKYO_PROCESS: studio
      MANGEKYO_INTAKE_DATA_DIR: /data/intake
      MANGEKYO_SETTINGS_FILE: /data/config/provider.json
      MANGEKYO_WORKSPACE_ACCESS_FILE: /data/config/workspace-access.json
      MANGEKYO_TASK_QUEUE: ${MANGEKYO_TASK_QUEUE:-mangekyo-studio}
      # 单机私有 Compose 自动激活全部 7 条 PINNED Worker Deployment（worker.ts 仅放行 loopback 与本 compose 服务 temporal）；
      # MANGEKYO_BUILD_ID 保持缺省，由 sourceBuildId() 自动计算镜像源码指纹防跨版本碰撞（仍可在 .env 显式覆盖）。
      MANGEKYO_ACTIVATE_LOCAL_BUILD: "1"
      # Python 计算沙箱由宿主机 Docker 提供；挂载 socket 后容器内 docker CLI 可用。
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - intakedata:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${STUDIO_PORT:-4317}:4317"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4317/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  temporaldata:
  intakedata:
